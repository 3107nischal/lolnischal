<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nischal is goat</title>
<style>
  :root {
    --bg: #ffffff;
    --fg-from: #171717;
    --fg-to: #404040;
    --glow: rgba(36, 122, 251, 0.6);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --fg-from: #737373;
      --fg-to: #ffffff;
      --glow: rgba(120, 190, 255, 0.75);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --fg-from: #737373;
    --fg-to: #ffffff;
    --glow: rgba(120, 190, 255, 0.75);
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  .lines {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--bg);
  }
  .lines svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    animation: fade 1s ease-out both;
  }
  .lines path {
    fill: none;
    stroke-width: 2.3;
    stroke-linecap: round;
    stroke-dasharray: 50 800;
    stroke-dashoffset: 800;
    opacity: 0;
    animation: run var(--t, 14s) linear var(--d, 0s) infinite;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes run {
    0%   { stroke-dashoffset: 800; stroke-dasharray: 50 800; opacity: 0; }
    25%  { opacity: 1; }
    50%  { opacity: 1; }
    70%, 100% { stroke-dashoffset: 0; stroke-dasharray: 20 800; opacity: 0; }
  }

  h1 {
    position: absolute;
    z-index: 2;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: max-content;
    max-width: 88%;
    margin: 0;
    text-align: center;
    font-size: clamp(2rem, 8vw, 4.5rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.03em;
    background: linear-gradient(to bottom, var(--fg-from), var(--fg-to));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 10px var(--glow)) drop-shadow(0 0 32px var(--glow));
  }

  @media (prefers-reduced-motion: reduce) {
    .lines path { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; opacity: 0.35; }
    .lines svg { animation: none; }
  }
</style>
</head>
